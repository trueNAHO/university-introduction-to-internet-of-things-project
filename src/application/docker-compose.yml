services:
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=Temp_DB
    volumes:
      - mongo_data:/data/db
      # mount sensor data (read-only)
      - ./assets:/data/Project_sensor_data:ro
      # initialization script
      - ./src/import-data.sh:/docker-entrypoint-initdb.d/import-data.sh:ro
    networks:
      - iot-network

  backend-api:
    build: ./src/api
    container_name: backend-api
    restart: always
    depends_on:
      - mongodb
    ports:
      - "8087:8087"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/Temp_DB
    networks:
      - iot-network

  frontend:
    build: ./src/ui  # Ensure this directory contains the frontend Flask app
    container_name: frontend
    restart: always
    depends_on:
      - backend-api
    ports:
      - "8080:5000"
    environment:
      - FLASK_APP=Flask_ui1.py
      - FLASK_ENV=development
    networks:
      - iot-network

