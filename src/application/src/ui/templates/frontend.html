<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center">

    <title>Room Selection System</title>

    <div id="intro-page" class="text-center w-full max-w-6xl bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-5xl font-bold mb-6">Room Selection Decision Support System</h1>
        <div class="flex border-b mb-4">
            <button onclick="showTab('room-selection')" class="tab-button px-4 py-2 text-lg font-bold bg-blue-500 text-white">Room Selection</button>
            <button onclick="showTab('swagger-docs')" class="tab-button px-4 py-2 text-lg font-bold bg-gray-300">API Documentation</button>
        </div>
        <div id="room-selection" class="tab-content p-4">
            <button onclick="showSelectionPage()" class="px-6 py-3 bg-blue-500 text-white text-xl rounded">Select Room</button>
        </div>
        <div id="swagger-docs" class="tab-content p-4 hidden">
            <h1 class="text-2xl font-bold mb-4">API Documentation</h1>
            <iframe src="/swagger" class="w-full h-96 border rounded"></iframe>
        </div>
    </div>


    <div id="selection-page" class="hidden w-full max-w-4xl bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4">Room Selection System</h1>
        <button onclick="goBack()" class="mt-6 px-4 py-2 bg-gray-500 text-white rounded">Back</button>
        <div class="flex gap-6">
            <div class="w-1/3">
                <h2 class="text-xl font-semibold">Set Preferences</h2>
                <label>Temperature Importance: <input type="number" id="temp_importance" min="1" max="9" value="5" class="border p-1 rounded w-full"></label>
                <label>Humidity Importance: <input type="number" id="humidity_importance" min="1" max="9" value="5" class="border p-1 rounded w-full"></label>
                <label>Light Importance: <input type="number" id="light_importance" min="1" max="9" value="5" class="border p-1 rounded w-full"></label>
                <label>Air Quality Importance: <input type="number" id="aqi_importance" min="1" max="9" value="5" class="border p-1 rounded w-full"></label>
            </div>
            
            <div class="w-1/3">
                <h2 class="text-xl font-semibold">Desired Room Profile</h2>
                <label>Temperature (°C): <input type="number" id="desired_temp" value="22" class="border p-1 rounded w-full"></label>
                <label>Humidity (%): <input type="number" id="desired_humidity" value="50" class="border p-1 rounded w-full"></label>
                <label>Light (lux): <input type="number" id="desired_light" value="300" class="border p-1 rounded w-full"></label>
                <label>AQI: <input type="number" id="desired_aqi" value="50" class="border p-1 rounded w-full"></label>
            </div>
            
            <div class="w-1/3">
                <h2 class="text-xl font-semibold">Facility Preferences</h2>
                <label>Seating Capacity: <input type="number" id="min_seating" value="10" class="border p-1 rounded w-full"></label>
                <label>Computers Needed: <input type="number" id="min_computers" value="0" class="border p-1 rounded w-full"></label>
                <label>Robots Needed: <input type="number" id="min_robots" value="0" class="border p-1 rounded w-full"></label>
                <label>Videoprojector: <input type="checkbox" id="require_videoprojector"></label>
            </div>
        </div>

        <button onclick="fetchRankings()" class="mt-6 px-4 py-2 bg-blue-500 text-white rounded">Rank Rooms</button>
        <ul id="room-list" class="mt-5"></ul>
        <button id="change-button" onclick="showSelectionPage()" class="hidden mt-4 px-4 py-2 bg-gray-500 text-white rounded">Change Preferences</button>
    </div>


    <script>
		const API_URL = "http://localhost:8087";

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            
            document.querySelectorAll('.tab-button').forEach(button => button.classList.replace('bg-blue-500', 'bg-gray-300'));
            event.target.classList.replace('bg-gray-300', 'bg-blue-500');
        }
        function goBack() {
            document.getElementById("selection-page").classList.add("hidden");
            document.getElementById("intro-page").classList.remove("hidden");
        }
        function showSelectionPage() {
            document.getElementById("intro-page").classList.add("hidden");
            document.getElementById("selection-page").classList.remove("hidden");
        }

        async function fetchRankings() {
    // Get user preferences for criteria weighting
  		  let preferences = {
  		    temperature: parseInt(document.getElementById("temp_importance").value),
  		    humidity: parseInt(document.getElementById("humidity_importance").value),
  		    light: parseInt(document.getElementById("light_importance").value),
  		    air_quality: parseInt(document.getElementById("aqi_importance").value),
  		  };

  		  // Get desired room profile
  		  let profile = {
  		    temperature: parseFloat(document.getElementById("desired_temp").value),
  		    humidity: parseFloat(document.getElementById("desired_humidity").value),
  		    light: parseFloat(document.getElementById("desired_light").value),
  		    air_quality: parseFloat(document.getElementById("desired_aqi").value),
  		    seating_capacity: parseInt(document.getElementById("min_seating").value),
  		    computers: parseInt(document.getElementById("min_computers").value),
  		    robots_for_training: parseInt(document.getElementById("min_robots").value),
  		    videoprojector: document.getElementById("require_videoprojector").checked
  		  };

  		  // Basic input validation for environment parameters
  		  if (profile.temperature < 10 || profile.temperature > 35) {
  		    alert("Error: Temperature should be between 10-35°C!");
  		    return;
  		  }
  		  if (profile.humidity < 40 || profile.humidity > 60) {
  		    alert("Error: Humidity should be between 40-60%");
  		    return;
  		  }
  		  if (profile.light < 100 || profile.light > 1000) {
  		    alert("Error: Light should be between 100-1000 lux!");
  		    return;
  		  }
  		  if (profile.air_quality < 0 || profile.air_quality > 500) {
  		    alert("Error: AQI should be between 0-500!");
  		    return;
  		  }

  		  try {
  		    // 1. Fetch the list of room names
  		    const namesResponse = await fetch(API_URL + '/RoomList/Names');
  		    const roomNames = await namesResponse.json(); // e.g. [ "Room_1", "Room_2", ... ]

  		    // 2. Fetch details for each room concurrently
  		    const roomDataPromises = roomNames.map(name =>
  		      fetch(API_URL + '/Rooms/Last/' + name).then(response => response.json())
  		    );
  		    const rooms = await Promise.all(roomDataPromises);

  		    // 3. Compute a ranking score for each room with defensive checks
  		    const scoredRooms = rooms.map(room => {
  		      // Defensive checks: provide a default value (or skip the room) if properties are missing.
  		      const roomTemp = (room.Temperature && room.Temperature.temperature !== undefined)
  		        ? room.Temperature.temperature
  		        : 0; // Or handle as desired

  		      const roomHumidity = (room.Humidity && room.Humidity.humidity !== undefined)
  		        ? room.Humidity.humidity
  		        : 0;

  		      const roomLight = (room.Light_Intensity && room.Light_Intensity.light_intensity !== undefined)
  		        ? room.Light_Intensity.light_intensity
  		        : 0;

  		      const roomAQ = (room.Air_Quality && room.Air_Quality.PM10 !== undefined)
  		        ? room.Air_Quality.PM10
  		        : 0;

  		      // Calculate absolute differences
  		      const diffTemp = Math.abs(roomTemp - profile.temperature);
  		      const diffHumidity = Math.abs(roomHumidity - profile.humidity);
  		      const diffLight = Math.abs(roomLight - profile.light);
  		      const diffAQ = Math.abs(roomAQ - profile.air_quality);

  		      // Facility penalty: add penalty if facilities do not meet desired values
  		      let facilityPenalty = 0;
  		      const facilities = room.Room_facilities || {}; // default to empty object if missing
  		      if (facilities.seating_capacity < profile.seating_capacity) {
  		        facilityPenalty += (profile.seating_capacity - facilities.seating_capacity) * 10;
  		      }
  		      if (facilities.computers < profile.computers) {
  		        facilityPenalty += (profile.computers - facilities.computers) * 10;
  		      }
  		      if (facilities.robots_for_training < profile.robots_for_training) {
  		        facilityPenalty += (profile.robots_for_training - facilities.robots_for_training) * 10;
  		      }
  		      if (profile.videoprojector && !facilities.videoprojector) {
  		        facilityPenalty += 50;
  		      }

  		      // Combine the differences with the user-defined weights
  		      const score =
  		        preferences.temperature * diffTemp +
  		        preferences.humidity * diffHumidity +
  		        preferences.light * diffLight +
  		        preferences.air_quality * diffAQ +
  		        facilityPenalty;

  		      return { ...room, score, name: room.name };
  		    });

  		    // 4. Sort the rooms by score (lower score indicates a closer match)
  		    scoredRooms.sort((a, b) => a.score - b.score);

  		    // 5. Display the ranked rooms in the UI
  		    let list = document.getElementById("room-list");
  		    list.innerHTML = "";
  		    if (scoredRooms.length === 0) {
  		      list.innerHTML = "<li class='alert'>No rooms match your preferences.</li>";
  		      return;
  		    }

  		    scoredRooms.forEach((room, index) => {
  		      const fac = room.Room_facilities || {};
  		      const facilitiesText = [];
  		      if (fac.videoprojector) facilitiesText.push("Videoprojector");
  		      facilitiesText.push(`Seats: ${fac.seating_capacity || "N/A"}`);
  		      if (fac.computers) facilitiesText.push(`Computers: ${fac.computers}`);
  		      if (fac.robots_for_training) facilitiesText.push(`Robots: ${fac.robots_for_training}`);

  		      list.innerHTML += `
  		        <li class='p-2 border bg-white rounded mb-2'>
  		          <span class='font-bold'>Rank ${index + 1}:</span> ${room.name}
  		          <span class='text-gray-600'>
  		            | Temp: ${room.Temperature ? room.Temperature.temperature : "N/A"}°C 
  		            | Humidity: ${room.Humidity ? room.Humidity.humidity : "N/A"}% 
  		            | Light: ${room.Light_Intensity ? room.Light_Intensity.light_intensity : "N/A"} lux 
  		            | Air Quality (PM10): ${room.Air_Quality ? room.Air_Quality.PM10 : "N/A"}
  		          </span>
  		          <br><span class='text-gray-700'>Facilities: ${facilitiesText.join(", ")}</span>
  		          <br><span class='text-gray-500'>Score: ${room.score.toFixed(2)}</span>
  		        </li>`;
  		    });
  		  } catch (error) {
  		    console.error("Error fetching or ranking rooms:", error);
  		    alert("Server error. Please try again later.");
  		  }
  		}
		async function fetchAndRankRooms() {
		    const API_URL = "http://localhost:8087";
		
		    // Fetch list of room names
		    let roomNames = await fetch(`${API_URL}/RoomList/Names`).then(res => res.json());
		    let roomsData = [];
		
		    // Fetch latest data for each room
		    for (let room of roomNames) {
		        let roomData = await fetch(`${API_URL}/Rooms/Last/${room}`).then(res => res.json());
		        roomsData.push(roomData);
		    }
		
		    // Get user preferences
		    let weights = {
		        temperature: parseInt(document.getElementById("temp_importance").value),
		        humidity: parseInt(document.getElementById("humidity_importance").value),
		        light: parseInt(document.getElementById("light_importance").value),
		        air_quality: parseInt(document.getElementById("aqi_importance").value)
		    };
		
		    // Normalize criteria values
		    let minMax = {};
		    ["temperature", "humidity", "light", "air_quality"].forEach(key => {
		        minMax[key] = {
		            min: Math.min(...roomsData.map(r => extractValue(r, key))),
		            max: Math.max(...roomsData.map(r => extractValue(r, key)))
		        };
		    });
		
		    roomsData.forEach(room => {
		        room.normalized = {
		            temperature: normalize(room, "temperature", minMax),
		            humidity: normalize(room, "humidity", minMax),
		            light: normalize(room, "light", minMax),
		            air_quality: normalize(room, "air_quality", minMax)
		        };
		    });
		
		    // Compute AHP scores
		    roomsData.forEach(room => {
		        room.ahpScore = Object.keys(weights).reduce((sum, key) => sum + (room.normalized[key] * weights[key]), 0);
		    });
		
		    // Sort rooms by score
		    roomsData.sort((a, b) => b.ahpScore - a.ahpScore);
		
		    // Display results
		    let list = document.getElementById("room-list");
		    list.innerHTML = "";
		    roomsData.forEach((room, index) => {
		        list.innerHTML += `<li class='p-2 border bg-white rounded mb-2'>
		            <span class='font-bold'>Rank ${index + 1}:</span> ${room.name}
		            <span class='text-gray-600'>| Temp: ${room.Temperature.temperature}°C | Humidity: ${room.Humidity.humidity}% | Light: ${room.Light_Intensity.light_intensity} lux | AQI: ${room.Air_Quality.PM10}</span>
		        </li>`;
		    });
		}
		
		function extractValue(room, key) {
		    const mapping = {
		        temperature: room.Temperature.temperature,
		        humidity: room.Humidity.humidity,
		        light: room.Light_Intensity.light_intensity,
		        air_quality: room.Air_Quality.PM10
		    };
		    return mapping[key];
		}

		function normalize(room, key, minMax) {
		    let value = extractValue(room, key);
		    return (value - minMax[key].min) / (minMax[key].max - minMax[key].min);
		}

		async function fetchRoomList() {
  			let para = document.getElementById('test');
			para.innerHTML = "test"
  			const response = await fetch('http://localhost:8087/RoomList', {
    			headers: new Headers({
      				'Transfer-Encoding': 'chunked',
					'Content-Security-Policy': 'default-src self "self"; script-src self "unsafe-inline"; style-src self "unsafe-inline";',
      				'Access-Control-Allow-Origin': '*',
      				'Access-Control-Allow-Methods': 'GET'
    			})
  			});


			const roomData = await response.json();
  			
  			// Assuming `response.json()` returns an array of room objects
			console.log(response.json())
  			para.innerHTML = JSON.stringify(roomData, null, 2);
		}
    </script>
</body>
</html>
