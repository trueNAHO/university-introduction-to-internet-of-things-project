      x-openapi-router-controller: swagger_server.controllers.default_controller
    post:
      summary: Add a new humidity level value to a room
      description: Adds a new humidity level value for the specified room.
      operationId: humidity_room_name_post
      parameters:
      - name: room_name
        in: path
        description: Name of the room to add humidity level data to
        required: true
        style: simple
        explode: false
        schema:
