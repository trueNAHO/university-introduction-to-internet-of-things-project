      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumidityValue"
        required: true
      responses:
        "201":
          description: Humidity level value successfully added to the room
        "400":
          description: Invalid input
        "404":
          description: Room not found
      x-openapi-router-controller: swagger_server.controllers.default_controller
  /Light_Intensity/{room_name}:
    get:
      summary: Retrieve light intensity levels of a room
      description: Returns a list of all light intensity values for a specific room.
      operationId: light_intensity_room_name_get
      parameters:
      - name: room_name
