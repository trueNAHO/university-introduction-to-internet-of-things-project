        description: Name of the room to add light intensity data to
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LightIntensityValue"
        required: true
      responses:
        "201":
          description: Light intensity value successfully added to the room
        "400":
          description: Invalid input
        "404":
          description: Room not found
      x-openapi-router-controller: swagger_server.controllers.default_controller
  /Sound/{room_name}:
    get:
      summary: Retrieve sound levels of a room
      description: Returns a list of all sound level values for a specific room.
      operationId: sound_room_name_get
      parameters:
      - name: room_name
        in: path
        description: Name of the room to retrieve sound level data for
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: A JSON array of sound level values for the specified room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_6"
        "404":
          description: Room not found
      x-openapi-router-controller: swagger_server.controllers.default_controller
    post:
      summary: Add a new sound level value to a room
      description: Adds a new sound level value for the specified room.
      operationId: sound_room_name_post
      parameters:
      - name: room_name
