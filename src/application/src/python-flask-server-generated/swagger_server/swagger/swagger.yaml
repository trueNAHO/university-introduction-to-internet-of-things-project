components:
  schemas:
    AirQualityValue:
      type: object
      properties:
        timestamp:
          type: string
          description: Timestamp of the air quality reading
          format: date-time
        PM2.5:
          type: number
          description: Concentration of PM2.5 particles in the air
          format: float
          example: 2.35
        PM10:
          type: number
          description: Concentration of PM10 particles in the air
          format: float
          example: 11.13
      example:
        PM2.5: 2.35
        PM10: 11.13
        timestamp: 2000-01-23T04:56:07.000+00:00
    AirQualityRoom:
      type: object
      properties:
        name:
          type: string
          description: Name of the room
          example: Room_1
        air_quality_data:
          type: array
          description: Air quality data for a specific room
          items:
            $ref: "#/components/schemas/AirQualityValue"
    CO2Value:
      type: object
      properties:
        timestamp:
          type: string
          description: Timestamp of the CO2 level reading
          format: date-time
        co2_level:
          type: number
          description: Concentration of CO2 level in the room
          format: float
          example: 434.13
      example:
        co2_level: 434.13
        timestamp: 2000-01-23T04:56:07.000+00:00
    CO2Room:
      type: object
      properties:
        name:
          type: string
          description: Name of the room
          example: Room_1
        co2_values:
          type: array
          description: CO2 level readings for a specific room
          items:
            $ref: "#/components/schemas/CO2Value"
    HumidityValue:
      type: object
      properties:
        timestamp:
          type: string
          description: Timestamp of the humidity reading
          format: date-time
        humidity:
          type: number
          description: Humidity level in percentage
          format: float
          example: 65.61
      example:
        humidity: 65.61
        timestamp: 2000-01-23T04:56:07.000+00:00
    HumidityRoom:
      type: object
      properties:
        name:
          type: string
          description: Name of the room
          example: Room_1
        humidity_values:
          type: array
          description: Humidity readings for a specific room
          items:
            $ref: "#/components/schemas/HumidityValue"
    LightIntensityValue:
      type: object
      properties:
        timestamp:
          type: string
          description: Timestamp of the light intensity reading
          format: date-time
        light_intensity:
          type: number
          description: Light intensity in a room
          format: float
          example: 174.34
      example:
        light_intensity: 174.34
        timestamp: 2000-01-23T04:56:07.000+00:00
    LightIntensityRoom:
      type: object
      properties:
        name:
          type: string
          description: Name of the room
          example: Room_1
        light_intensity_values:
          type: array
          description: Light intensity readings for a specific room
          items:
            $ref: "#/components/schemas/LightIntensityValue"
    SoundValue:
      type: object
      properties:
        timestamp:
          type: string
          description: Timestamp of the sound level reading
          format: date-time
        sound_level:
          type: number
          description: Sound level in decibels (dB)
          format: float
          example: 40.37
      example:
        sound_level: 40.37
        timestamp: 2000-01-23T04:56:07.000+00:00
    SoundRoom:
      type: object
      properties:
        name:
          type: string
          description: Name of the room
          example: Room_1
        sound_values:
          type: array
          description: Sound level readings for a specific room
          items:
            $ref: "#/components/schemas/SoundValue"
    TemperatureValue:
      type: object
      properties:
        timestamp:
          type: string
          description: Timestamp of the temperature reading
          format: date-time
        temperature:
          type: number
          description: Temperature in degrees Celsius
          format: float
          example: 27.32
      example:
        temperature: 27.32
        timestamp: 2000-01-23T04:56:07.000+00:00
    TemperatureRoom:
      type: object
      properties:
        name:
          type: string
          description: Name of the room
          example: Room_1
        temperature_values:
          type: array
          description: Temperature readings for a specific room
          items:
            $ref: "#/components/schemas/TemperatureValue"
    VOCValue:
      type: object
      properties:
        timestamp:
          type: string
          description: Timestamp of the VOC level reading
          format: date-time
        VOC_level:
          type: number
          description: VOC concentration in the air
          format: float
          example: 436.65
      example:
        VOC_level: 436.65
        timestamp: 2000-01-23T04:56:07.000+00:00
    VOCRoom:
      type: object
      properties:
        name:
          type: string
          description: Name of the room
          example: Room_1
        voc_values:
          type: array
          description: VOC level readings for a specific room
          items:
            $ref: "#/components/schemas/VOCValue"
    RoomFacilities:
      type: object
      properties:
        videoprojector:
          type: boolean
          description: Indicates whether the room has a videoprojector
          example: true
        seating_capacity:
          type: integer
          description: Seating capacity of the room
          example: 62
        computers:
          type: integer
          description: Number of computers available in the room
          example: 20
        robots_for_training:
          type: integer
          description: Number of robots available for training in the room
          example: 10
      example:
        seating_capacity: 62
        videoprojector: true
        robots_for_training: 10
        computers: 20
    FacilityRooms:
      type: object
      properties:
        rooms:
          type: array
          description: List of rooms with their facilities
          items:
            $ref: "#/components/schemas/FacilityRooms_rooms"
    inline_response_200:
      type: object
      properties:
        name:
          type: string
          description: Name of the room
          example: Room_1
        Air_Quality:
          $ref: "#/components/schemas/AirQualityValue"
        CO2:
          $ref: "#/components/schemas/CO2Value"
        Humidity:
          $ref: "#/components/schemas/HumidityValue"
        Light_Intensity:
          $ref: "#/components/schemas/LightIntensityValue"
        Sound:
          $ref: "#/components/schemas/SoundValue"
        Temperature:
          $ref: "#/components/schemas/TemperatureValue"
        VOC:
          $ref: "#/components/schemas/VOCValue"
        Room_facilites:
          $ref: "#/components/schemas/RoomFacilities"
      example:
        Room_facilites:
          seating_capacity: 62
          videoprojector: true
          robots_for_training: 10
          computers: 20
        Temperature:
          temperature: 27.32
          timestamp: 2000-01-23T04:56:07.000+00:00
        CO2:
          co2_level: 434.13
          timestamp: 2000-01-23T04:56:07.000+00:00
        Humidity:
          humidity: 65.61
          timestamp: 2000-01-23T04:56:07.000+00:00
        name: Room_1
        Air_Quality:
          PM2.5: 2.35
          PM10: 11.13
          timestamp: 2000-01-23T04:56:07.000+00:00
        Sound:
          sound_level: 40.37
          timestamp: 2000-01-23T04:56:07.000+00:00
        VOC:
          VOC_level: 436.65
          timestamp: 2000-01-23T04:56:07.000+00:00
        Light_Intensity:
          light_intensity: 174.34
          timestamp: 2000-01-23T04:56:07.000+00:00
    inline_response_201:
      type: object
      properties:
        room:
          $ref: "#/components/schemas/inline_response_201_room"
      example:
        room:
          Temperature_Data: []
          Air_Quality_Data: []
          Room_facilites_Data: []
          Light_Intensity_Data: []
          name: Room_1
          Sound_Data: []
          CO2_Data: []
          VOC_Data: []
          Humidity_Data: []
    inline_response_200_1:
      type: object
      properties:
        old_name:
          type: string
          example: Old_Room_Name
        updated_name:
          type: string
          example: Updated_Room_Name
      example:
        updated_name: Updated_Room_Name
        old_name: Old_Room_Name
    inline_response_200_2:
      type: object
      properties:
        room_name:
          type: string
          description: Name of the room
          example: Room_1
        air_quality_data:
          type: array
          description: List of air quality values for the room
          items:
            $ref: "#/components/schemas/AirQualityValue"
      example:
        room_name: Room_1
        air_quality_data:
        - PM2.5: 2.35
          PM10: 11.13
          timestamp: 2000-01-23T04:56:07.000+00:00
        - PM2.5: 2.35
          PM10: 11.13
          timestamp: 2000-01-23T04:56:07.000+00:00
    inline_response_200_3:
      type: object
      properties:
        room_name:
          type: string
          description: Name of the room
          example: Room_1
        co2_data:
          type: array
          description: List of CO2 level values for the room
          items:
            $ref: "#/components/schemas/CO2Value"
      example:
        room_name: Room_1
        co2_data:
        - co2_level: 434.13
          timestamp: 2000-01-23T04:56:07.000+00:00
        - co2_level: 434.13
          timestamp: 2000-01-23T04:56:07.000+00:00
    inline_response_200_4:
      type: object
      properties:
        room_name:
          type: string
          description: Name of the room
          example: Room_1
        humidity_data:
          type: array
          description: List of humidity level values for the room
          items:
            $ref: "#/components/schemas/HumidityValue"
