openapi: 3.0.0
info:
  title: Project API
  description: API for managing sensors in rooms.
  version: 0.0.1
servers:
- url: http://localhost:8087
  description: Testing server
paths:
  /RoomList:
    get:
      summary: Retrive a list of room
      description: "Returns a list of all rooms, each including their associated details."
      operationId: room_list_get
      responses:
        "200":
          description: A JSON array of room names with their sensor values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/inline_response_200"
                x-content-type: application/json
      x-openapi-router-controller: swagger_server.controllers.default_controller
    post:
      summary: Add a new AirQualityRoom
      description: Adds a new Room with empty data.
      operationId: room_list_post
      requestBody:
        content:
          application/json:
            schema:
              type: string
              description: Name of the room to be created
              example: Room_1
        required: true
      responses:
        "201":
          description: Room successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_201"
        "404":
          description: Room already exist for the specified name
      x-openapi-router-controller: swagger_server.controllers.default_controller
  /Rooms/{room_name}:
    get:
      summary: Retrive a list of room
      description: "Returns a list of all rooms, each including their associated details."
      operationId: rooms_room_name_get
      parameters:
      - name: room_name
        in: path
        description: name of the room that needs to be fetched
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: A JSON array of room names with their sensor values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/inline_response_200"
                x-content-type: application/json
      x-openapi-router-controller: swagger_server.controllers.default_controller
    put:
      summary: Update room name
      description: Updates the name of an existing room.
      operationId: rooms_room_name_put
      parameters:
      - name: room_name
        in: path
        description: Current name of the room that needs to be updated
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: New name of the room
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: Room name updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_1"
        "400":
          description: Invalid input
        "404":
          description: Room not found
      x-openapi-router-controller: swagger_server.controllers.default_controller
    delete:
      summary: Delete a Room
      description: Removes a Room from the room’s record.
      operationId: rooms_room_name_delete
      parameters:
      - name: room_name
        in: path
        description: name of the room that needs to be deleted
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "204":
          description: Room successfully deleted
        "404":
          description: Room not found for the specified name
      x-openapi-router-controller: swagger_server.controllers.default_controller
  /Air_Quality/{room_name}:
    get:
      summary: Retrieve air quality of a room
      description: Returns a list of all air quality values for a specific room.
      operationId: air_quality_room_name_get
      parameters:
      - name: room_name
        in: path
        description: Name of the room to retrieve air quality data for
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: A JSON array of air quality values for the specified room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_2"
        "404":
          description: Room not found
      x-openapi-router-controller: swagger_server.controllers.default_controller
    post:
      summary: Add a new air quality value to a room
      description: Adds a new air quality value for the specified room.
      operationId: air_quality_room_name_post
      parameters:
      - name: room_name
        in: path
        description: Name of the room to add air quality data to
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AirQualityValue"
        required: true
      responses:
        "201":
          description: Air quality value successfully added to the room
        "400":
          description: Invalid input
        "404":
          description: Room not found
      x-openapi-router-controller: swagger_server.controllers.default_controller
  /CO2/{room_name}:
    get:
      summary: Retrieve CO2 levels of a room
      description: Returns a list of all CO2 level values for a specific room.
      operationId: c_o2_room_name_get
      parameters:
      - name: room_name
