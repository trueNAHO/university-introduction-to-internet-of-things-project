      responses:
        "200":
          description: A JSON array of light intensity values for the specified room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/inline_response_200_5"
        "404":
          description: Room not found
      x-openapi-router-controller: swagger_server.controllers.default_controller
    post:
      summary: Add a new light intensity value to a room
      description: Adds a new light intensity value for the specified room.
      operationId: light_intensity_room_name_post
      parameters:
      - name: room_name
