      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoundValue"
        required: true
      responses:
        "201":
          description: Sound level value successfully added to the room
        "400":
          description: Invalid input
        "404":
          description: Room not found
      x-openapi-router-controller: swagger_server.controllers.default_controller
  /Temperature/{room_name}:
    get:
      summary: Retrieve temperature of a room
      description: Returns a list of all temperature values for a specific room.
      operationId: temperature_room_name_get
      parameters:
