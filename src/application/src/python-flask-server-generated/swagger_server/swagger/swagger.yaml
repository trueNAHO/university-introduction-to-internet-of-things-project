                $ref: "#/components/schemas/inline_response_200_3"
        "404":
          description: Room not found
      x-openapi-router-controller: swagger_server.controllers.default_controller
    post:
      summary: Add a new CO2 level value to a room
      description: Adds a new CO2 level value for the specified room.
      operationId: c_o2_room_name_post
      parameters:
      - name: room_name
        in: path
        description: Name of the room to add CO2 level data to
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
